---
# Matching these members prunes their subtrees so nested annotation elements
# cannot be collected as members of the enclosing annotation.
id: java-annotation-member-interface
language: Java
role: member
parentRuleIds: [java-annotation-type]
symbolType: interface
rule:
  all:
    - any:
        - kind: annotation_type_declaration
        - kind: interface_declaration
    - has:
        field: name
        pattern: $NAME
name: $NAME
isPublic: true
