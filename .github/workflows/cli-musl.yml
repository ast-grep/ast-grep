name: Build musl CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cli-musl.yml
      - .github/workflows/release.yml
      - .cargo/config.toml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - npm/**

permissions:
  contents: read

jobs:
  build:
    name: CLI - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Exercise the same build action and targets as the release workflow.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sg,ast-grep
          target: ${{ matrix.target }}
          archive: app-$target
          tar: none
          zip: all
          dry-run: true
          dry-run-intended: true
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - name: Build custom parser in Alpine
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" -w /work -e TARGET \
            -v "${CARGO_HOME:-$HOME/.cargo}/registry/src:/registry:ro" \
            alpine:3.22 sh -euxc '
              apk add --no-cache build-base
              parser=$(find /registry -path "*/tree-sitter-json-*/src/parser.c" | head -n 1)
              cc -shared -fPIC -I "$(dirname "$parser")" "$parser" -o "target/$TARGET/json.so"
            '
      - name: Test npm packages in a fresh Alpine container
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work:ro" -w /work -e TARGET \
            node:22-alpine3.22 sh -euxc '
              node --test npm/test/postinstall.test.js
              node npm/test/musl.js
            '
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: app-${{ matrix.target }}.zip
          if-no-files-found: error
