name: Release

permissions:
  contents: write

on:
  # Build and test musl binaries without publishing.
  workflow_dispatch: null
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .cargo/config.toml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - npm/**
  push:
    tags:
      - "[0-9]+.*"
jobs:
  test-musl:
    if: github.event_name != 'push'
    permissions:
      contents: read
    name: CLI - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Exercise the same build action and targets as upload-assets without publishing.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sg,ast-grep
          target: ${{ matrix.target }}
          archive: app-$target
          tar: none
          zip: all
          dry-run: true
          dry-run-intended: true
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - name: Build custom parser in Alpine
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" -w /work -e TARGET \
            -v "${CARGO_HOME:-$HOME/.cargo}/registry/src:/registry:ro" \
            alpine:3.22 sh -euxc '
              apk add --no-cache build-base
              parser=$(find /registry -path "*/tree-sitter-json-*/src/parser.c" | head -n 1)
              cc -shared -fPIC -I "$(dirname "$parser")" "$parser" -o "target/$TARGET/json.so"
            '
      - name: Test npm packages in a fresh Alpine container
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work:ro" -w /work -e TARGET \
            node:22-alpine3.22 sh -euxc '
              node --test npm/test/postinstall.test.js
              node npm/test/musl.js
            '
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: app-${{ matrix.target }}.zip
          if-no-files-found: error

  push_crates_io:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          publish-delay: 5000

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sg,ast-grep
          tar: none
          # (optional) On which platform to distribute the `.zip` file.
          # [default value: windows]
          # [possible values: all, unix, windows, none]
          zip: all
          target: ${{ matrix.target }}
          archive: app-$target
          # uncomment this for debug
          # ref: refs/tags/debug_release
        env:
          # (required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    name: Release npm cli
    needs:
      - upload-assets
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
      - name: Download artifacts
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: "*.zip"
          out-file-path: artifacts
      - name: Unzip packages
        run: |
          files=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl)
          target_dir=(darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl)
          length=${#files[@]}
          for (( i=0; i<${length}; i++ ));
          do
            unzip "artifacts/app-${files[$i]}.zip" -d "npm/platforms/${target_dir[$i]}/"
          done
          # windows
          files=(x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc)
          target_dir=(win32-x64-msvc win32-ia32-msvc win32-arm64-msvc)
          length=${#files[@]}
          for (( i=0; i<${length}; i++ ));
          do
            unzip "artifacts/app-${files[$i]}.zip" -d "npm/platforms/${target_dir[$i]}/"
          done
      - run: echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm
        run: |
          cd npm
          for pkg in platforms/*; do
            echo "Publishing $pkg..."
            cd $pkg;
            npm publish;
            cd ../..;
          done
          echo "Publishing @ast-grep/cli...";
          npm publish
  changelog:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: "✏️ Generate release changelog"
        uses: heinrichreimer/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
