name: Release

permissions:
  contents: write

on:
  # Build and test every CLI package without publishing.
  workflow_dispatch: null
  schedule:
    - cron: "0 9 * * *"
  push:
    tags:
      - "[0-9]+.*"
jobs:
  push_crates_io:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          publish-delay: 5000

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build CLI - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: &cli-platforms
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
            node-arch: x86
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            test-os: windows-11-arm
            node-arch: arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            node-arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            test-os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            test-os: ubuntu-22.04-arm
            node-arch: arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            test-os: ubuntu-22.04-arm
            node-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sg,ast-grep
          tar: none
          # (optional) On which platform to distribute the `.zip` file.
          # [default value: windows]
          # [possible values: all, unix, windows, none]
          zip: all
          target: ${{ matrix.target }}
          archive: app-$target
          dry-run: ${{ github.event_name != 'push' }}
          dry-run-intended: true
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          name: cli-${{ matrix.target }}
          path: app-${{ matrix.target }}.zip
          if-no-files-found: error
  test-cli:
    # Test available archives even when another platform's build failed.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    permissions:
      contents: read
    needs: upload-assets
    name: Test CLI - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: *cli-platforms
    runs-on: ${{ matrix.test-os || matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli-${{ matrix.target }}
          path: cli-artifacts
      - name: Extract platform package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z x "cli-artifacts/app-$TARGET.zip" -ocli-artifacts/bin
          else
            unzip "cli-artifacts/app-$TARGET.zip" -d cli-artifacts/bin
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          architecture: ${{ matrix.node-arch || 'x64' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare custom parser source
        run: node npm/test/parser.js prepare
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.node-arch || 'x64' }}
      - name: Test npm package
        working-directory: npm
        run: npm run test:ci

  release-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    name: Release npm cli
    needs:
      - upload-assets
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
      - name: Download artifacts
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: "*.zip"
          out-file-path: artifacts
      - name: Unzip packages
        run: |
          files=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl)
          target_dir=(darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl)
          length=${#files[@]}
          for (( i=0; i<${length}; i++ ));
          do
            unzip "artifacts/app-${files[$i]}.zip" -d "npm/platforms/${target_dir[$i]}/"
          done
          # windows
          files=(x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc)
          target_dir=(win32-x64-msvc win32-ia32-msvc win32-arm64-msvc)
          length=${#files[@]}
          for (( i=0; i<${length}; i++ ));
          do
            unzip "artifacts/app-${files[$i]}.zip" -d "npm/platforms/${target_dir[$i]}/"
          done
      - run: echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm
        run: |
          cd npm
          for pkg in platforms/*; do
            echo "Publishing $pkg..."
            cd $pkg;
            npm publish;
            cd ../..;
          done
          echo "Publishing @ast-grep/cli...";
          npm publish
  changelog:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: "✏️ Generate release changelog"
        uses: heinrichreimer/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
